<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Villa Mascota</title>
</head>
<body>
<title>Villa Mascota</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --page:#b9e0f4;--page2:#eaf7fe;--page-text:#3b2b20;
  --blue:#3aa3ea;--blue-d:#1b6fb4;--gold:#ffcf3a;--gold-d:#c98d0c;
  --green:#45c068;--green-d:#23853d;--red:#ef5350;--red-d:#b3261e;
  --pink:#ff7eb0;--pink-d:#c9437d;--ink:#4a3324;--paper:#fffdf6;--edge:#a8d4f3;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--page:#122030;--page2:#1d3349;--page-text:#e6eef6;color-scheme:dark}
}
:root[data-theme="dark"]{--page:#122030;--page2:#1d3349;--page-text:#e6eef6;color-scheme:dark}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;overflow:hidden;color:var(--page-text);
  background:radial-gradient(circle at 30% 20%,var(--page2),var(--page));
  font-family:'Baloo 2','Trebuchet MS','Segoe UI',system-ui,sans-serif}
#app{width:100%;height:100%;display:flex;align-items:center;justify-content:center;container-type:size}
#stage{--u:1cqw;position:relative;width:min(100cqw - 12px,1180px,(100cqh - 12px)*1.6);aspect-ratio:16/10;
  container-type:inline-size;overflow:hidden;border-radius:calc(var(--u)*1.8);
  box-shadow:0 10px 40px rgba(0,0,0,.25);background:#9fd8f5;color:var(--ink);
  font-size:calc(var(--u)*1.7);user-select:none;-webkit-user-select:none;touch-action:manipulation;
  -webkit-tap-highlight-color:transparent}
@media (max-aspect-ratio:4/5){
  #stage{aspect-ratio:2/3;width:min(100cqw - 8px,(100cqh - 8px)*.6667);--u:1.75cqw}
}
button{font-family:inherit;color:inherit}
button:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.scene{position:absolute;inset:0;overflow:hidden}

/* ---------- Buttons & panels ---------- */
.rbtn{appearance:none;border:calc(var(--u)*.35) solid #fff;cursor:pointer;
  width:calc(var(--u)*6.2);height:calc(var(--u)*6.2);border-radius:50%;
  background:radial-gradient(circle at 35% 28%,#8ed1fa,var(--blue) 55%,var(--blue-d));
  box-shadow:0 calc(var(--u)*.35) 0 var(--blue-d),0 calc(var(--u)*.6) calc(var(--u)*1) rgba(0,0,0,.25);
  font-size:calc(var(--u)*2.8);display:grid;place-items:center;padding:0;line-height:1;transition:transform .08s}
.rbtn:active{transform:translateY(calc(var(--u)*.3))}
.rbtn.sm{width:calc(var(--u)*4.6);height:calc(var(--u)*4.6);font-size:calc(var(--u)*2.1)}
.rbtn img{width:76%;height:76%;object-fit:contain;filter:drop-shadow(0 1px 1px rgba(0,0,0,.3))}
.rbtn.red{background:radial-gradient(circle at 35% 28%,#ff9c94,var(--red) 55%,var(--red-d));box-shadow:0 calc(var(--u)*.35) 0 var(--red-d),0 calc(var(--u)*.6) calc(var(--u)*1) rgba(0,0,0,.25);color:#fff;font-weight:800}
.btn{appearance:none;border:calc(var(--u)*.3) solid #fff;cursor:pointer;border-radius:calc(var(--u)*5);
  padding:calc(var(--u)*.55) calc(var(--u)*1.8);font-weight:800;font-size:calc(var(--u)*1.7);color:#fff;
  text-shadow:0 1px 0 rgba(0,0,0,.25);background:linear-gradient(#69b9f2,var(--blue));
  box-shadow:0 calc(var(--u)*.3) 0 var(--blue-d),0 calc(var(--u)*.5) calc(var(--u)*.8) rgba(0,0,0,.2);
  transition:transform .08s;white-space:nowrap;line-height:1.25}
.btn:active{transform:translateY(calc(var(--u)*.3));filter:brightness(.96)}
.btn.green{background:linear-gradient(#73d78e,var(--green));box-shadow:0 calc(var(--u)*.3) 0 var(--green-d),0 calc(var(--u)*.5) calc(var(--u)*.8) rgba(0,0,0,.2)}
.btn.gold{background:linear-gradient(#ffe07a,#f5b81c);color:#6b4708;text-shadow:0 1px 0 rgba(255,255,255,.5);box-shadow:0 calc(var(--u)*.3) 0 var(--gold-d),0 calc(var(--u)*.5) calc(var(--u)*.8) rgba(0,0,0,.2)}
.btn.red{background:linear-gradient(#ff8a80,var(--red));box-shadow:0 calc(var(--u)*.3) 0 var(--red-d),0 calc(var(--u)*.5) calc(var(--u)*.8) rgba(0,0,0,.2)}
.btn.pink{background:linear-gradient(#ffa8cb,var(--pink));box-shadow:0 calc(var(--u)*.3) 0 var(--pink-d),0 calc(var(--u)*.5) calc(var(--u)*.8) rgba(0,0,0,.2)}
.btn.sm{font-size:calc(var(--u)*1.4);padding:calc(var(--u)*.3) calc(var(--u)*1.2)}
.btn.big{font-size:calc(var(--u)*2.3);padding:calc(var(--u)*.8) calc(var(--u)*2.6)}
.btn[disabled]{filter:grayscale(.8);opacity:.7;cursor:default}
.panel{background:var(--paper);border:calc(var(--u)*.4) solid var(--edge);border-radius:calc(var(--u)*1.8);
  box-shadow:0 calc(var(--u)*.4) 0 #7fb6de,0 calc(var(--u)*.8) calc(var(--u)*2) rgba(0,0,0,.2)}
.muted{color:#8b7461}

/* ---------- HUD ---------- */
.hud{position:absolute;left:0;right:0;top:0;z-index:900;display:flex;align-items:center;gap:calc(var(--u)*1.2);
  padding:calc(var(--u)*.9) calc(var(--u)*1.2);pointer-events:none}
.hud>*{pointer-events:auto}
.money{display:flex;gap:calc(var(--u)*.8)}
.pill{display:flex;align-items:center;gap:calc(var(--u)*.5);background:rgba(255,255,255,.85);
  border:calc(var(--u)*.3) solid #fff;border-radius:calc(var(--u)*3);padding:calc(var(--u)*.1) calc(var(--u)*1.2) calc(var(--u)*.1) calc(var(--u)*.2);
  box-shadow:0 calc(var(--u)*.3) calc(var(--u)*.6) rgba(0,0,0,.15);font-weight:800;font-size:calc(var(--u)*1.9);color:#6b4708}
.pill .ico{width:calc(var(--u)*3.2);height:calc(var(--u)*3.2);border-radius:50%;display:grid;place-items:center;font-size:calc(var(--u)*1.9)}
.pill.coin .ico{background:radial-gradient(circle at 35% 30%,#fff2a8,var(--gold) 60%,var(--gold-d))}
.pill.cash{color:#1f7a3a}
.pill.cash .ico{background:radial-gradient(circle at 35% 30%,#c9f5d4,var(--green) 60%,var(--green-d))}
.lvl{display:flex;align-items:center;gap:calc(var(--u)*.6);margin-left:auto}
.star{width:calc(var(--u)*4.4);height:calc(var(--u)*4.4);display:grid;place-items:center;font-weight:800;color:#fff;font-size:calc(var(--u)*1.8);
  background:var(--gold);clip-path:polygon(50% 0,63% 32%,98% 35%,71% 57%,80% 92%,50% 73%,20% 92%,29% 57%,2% 35%,37% 32%);
  text-shadow:0 1px 1px rgba(0,0,0,.4);padding-top:calc(var(--u)*.4)}
.xpbar{position:relative;width:calc(var(--u)*17);height:calc(var(--u)*2.3);background:rgba(90,61,34,.75);border:calc(var(--u)*.25) solid #fff;border-radius:calc(var(--u)*2);overflow:hidden}
.xpbar i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(#ffe57a,#f2b51b);border-radius:calc(var(--u)*2);transition:width .4s}
.xpbar span{position:absolute;inset:0;display:grid;place-items:center;font-size:calc(var(--u)*1.25);font-weight:800;color:#fff;text-shadow:0 1px 1px rgba(0,0,0,.6)}
.ltitle{font-size:calc(var(--u)*1.25);font-weight:700;color:#4a3324;text-align:center;text-shadow:0 1px 0 rgba(255,255,255,.7);line-height:1.2}
.statrings{display:flex;gap:calc(var(--u)*.6);align-items:center}
.ring{--p:50;--c:#4caf50;width:calc(var(--u)*4.6);height:calc(var(--u)*4.6);border-radius:50%;padding:calc(var(--u)*.45);
  background:conic-gradient(var(--c) calc(var(--p)*1%),rgba(255,255,255,.6) 0);box-shadow:0 calc(var(--u)*.3) calc(var(--u)*.6) rgba(0,0,0,.2)}
.ring span{display:grid;place-items:center;width:100%;height:100%;border-radius:50%;background:#fff;font-size:calc(var(--u)*1.8)}
@media (max-aspect-ratio:4/5){
  .hud{flex-wrap:wrap;row-gap:calc(var(--u)*.6)}
  .lvl{order:3;margin-left:0}
  .statrings{margin-left:auto}
}

/* ---------- Dock & actions ---------- */
.dock{position:absolute;left:50%;bottom:calc(var(--u)*1);transform:translateX(-50%);z-index:900;display:flex;gap:calc(var(--u)*1.2);
  padding:calc(var(--u)*.7) calc(var(--u)*1.4);background:rgba(255,255,255,.55);border-radius:calc(var(--u)*3);backdrop-filter:blur(3px)}
.dock.compact{left:calc(var(--u)*1);transform:none;gap:calc(var(--u)*.8)}
.dbtn{display:flex;flex-direction:column;align-items:center;gap:calc(var(--u)*.1);background:none;border:0;padding:0;cursor:pointer}
.dbtn em{font-style:normal;font-weight:800;font-size:calc(var(--u)*1.25);color:#4a3324;text-shadow:0 1px 0 #fff}
.acts{position:absolute;left:calc(var(--u)*1.2);top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:calc(var(--u)*1.1);z-index:850}
.acts .dbtn em{background:rgba(255,255,255,.8);padding:0 calc(var(--u)*.6);border-radius:calc(var(--u)*1)}
.hint{position:absolute;left:50%;top:calc(var(--u)*7.4);transform:translateX(-50%);z-index:880;padding:calc(var(--u)*.5) calc(var(--u)*1.6);
  font-weight:700;display:flex;align-items:center;gap:calc(var(--u)*1);white-space:nowrap;font-size:calc(var(--u)*1.55)}
@media (max-aspect-ratio:4/5){.hint{top:calc(var(--u)*13);white-space:normal;width:90%;justify-content:center;text-align:center}}

/* ---------- Room ---------- */
.room{position:absolute;inset:0}
.wall{position:absolute;left:0;right:0;top:0;height:60%}
.base{position:absolute;left:0;right:0;top:57.5%;height:3.5%;background:linear-gradient(#9a6741,#6d4329);box-shadow:0 2px 0 rgba(0,0,0,.12)}
.floor{position:absolute;left:0;right:0;top:61%;bottom:0;box-shadow:inset 0 calc(var(--u)*1.2) calc(var(--u)*1.5) rgba(0,0,0,.12)}
.window{position:absolute;top:16%;width:calc(var(--u)*16);height:40%;border:calc(var(--u)*.8) solid #a8703f;
  border-radius:calc(var(--u)*7) calc(var(--u)*7) calc(var(--u)*.8) calc(var(--u)*.8);
  background:radial-gradient(ellipse 30% 14% at 30% 62%,#fff 98%,transparent),radial-gradient(ellipse 22% 10% at 64% 30%,#fff 98%,transparent),linear-gradient(#7cc9fb,#d7f0ff);
  box-shadow:inset 0 0 0 calc(var(--u)*.35) #e0b277,0 calc(var(--u)*.5) 0 rgba(0,0,0,.15);overflow:hidden}
.window::before,.window::after{content:"";position:absolute;background:#e0b277}
.window::before{left:48%;width:4%;top:0;bottom:0}
.window::after{top:46%;height:5%;left:0;right:0}
.w1{left:5%}.w2{right:5%}
.door{position:absolute;left:calc(50% - var(--u)*8);width:calc(var(--u)*16);bottom:0;height:74%;background:linear-gradient(90deg,#9b6a42,#b98552 50%,#9b6a42);
  border:calc(var(--u)*.8) solid #e7b53a;border-bottom:none;border-radius:50% 50% 0 0/26% 26% 0 0;box-shadow:inset 0 0 0 calc(var(--u)*.5) #7d522f}
.door::before{content:"";position:absolute;left:18%;right:18%;top:10%;height:26%;border-radius:50% 50% 8% 8%/60% 60% 8% 8%;background:linear-gradient(#8fd3ff,#e3f5ff);border:calc(var(--u)*.4) solid #e7b53a}
.door::after{content:"";position:absolute;right:12%;top:56%;width:calc(var(--u)*1.2);height:calc(var(--u)*1.2);border-radius:50%;background:#f6cf4a;box-shadow:0 1px 0 #9a6a0a}
.mat{position:absolute;left:calc(50% - var(--u)*9.5);width:calc(var(--u)*19);top:63%;height:7%;background:#e9bd4f;border-radius:calc(var(--u)*.8);border:calc(var(--u)*.35) solid #b9862a;
  display:grid;place-items:center;font-weight:800;color:#7a4e1f;font-size:calc(var(--u)*2);letter-spacing:.12em;z-index:1}
.furn{position:absolute;transform:translate(-50%,-100%);line-height:1;filter:drop-shadow(0 calc(var(--u)*.35) 0 rgba(0,0,0,.18));padding:calc(var(--u)*.2)}
.icowrap{display:inline-block;width:1em;height:1em;line-height:1;vertical-align:-0.08em}
.icowrap svg{display:block;width:100%;height:100%;overflow:visible}
.room.decor .furn{cursor:grab;touch-action:none}
.room.decor .furn:hover{filter:drop-shadow(0 calc(var(--u)*.35) 0 rgba(0,0,0,.18)) drop-shadow(0 0 calc(var(--u)*.5) rgba(27,111,180,.75))}
.room.decor .furn.sel{filter:drop-shadow(0 calc(var(--u)*.35) 0 rgba(0,0,0,.18)) drop-shadow(0 0 calc(var(--u)*.7) #1b6fb4) drop-shadow(0 0 calc(var(--u)*.7) #1b6fb4)}
.room.decor .furn.landing{filter:drop-shadow(0 calc(var(--u)*.35) 0 rgba(0,0,0,.18)) drop-shadow(0 0 calc(var(--u)*.7) #ffcf3a) drop-shadow(0 0 calc(var(--u)*.7) #ffcf3a)}
.poop{position:absolute;transform:translate(-50%,-100%);background:none;border:0;padding:0;cursor:pointer;font-size:calc(var(--u)*3.2);line-height:1;filter:drop-shadow(0 2px 0 rgba(0,0,0,.2))}
.gift{position:absolute;transform:translate(-50%,-100%);background:none;border:0;cursor:pointer;font-size:calc(var(--u)*5.5);line-height:1;z-index:950;
  filter:drop-shadow(0 0 calc(var(--u)*1.2) #ffe36b);animation:giftBob 1.4s ease-in-out infinite}
@keyframes giftBob{50%{transform:translate(-50%,-112%) rotate(-4deg)}}

/* ---------- Pet ---------- */
.petwrap{position:absolute;width:calc(var(--u)*15);transform:translate(-50%,-100%);cursor:pointer;touch-action:none}
.petwrap.small{width:calc(var(--u)*11)}
.petwrap.tiny{width:calc(var(--u)*8.5)}
.petwrap.static{cursor:default}
.petbody{transform-origin:50% 100%}
.flip{transition:transform .18s}
.petsvg{display:block;width:100%;height:auto;overflow:visible}
.shadow{position:absolute;left:16%;right:16%;bottom:-3%;height:8%;border-radius:50%;background:radial-gradient(rgba(0,0,0,.28),transparent 70%);z-index:-1}
.idle .petbody{animation:breathe 2.6s ease-in-out infinite}
.walking .petbody{animation:hop .42s ease-in-out infinite}
.running .petbody{animation:hop .26s ease-in-out infinite}
.eating .petbody{animation:munch .32s ease-in-out infinite}
.jumping .petbody{animation:jump 1s ease-out}
.slip .petbody{animation:slip .9s ease-out}
.pop .petbody{animation:pop .5s ease-out}
@keyframes breathe{50%{transform:scale(1.02,.975)}}
@keyframes hop{50%{transform:translateY(-6%) rotate(2deg)}}
@keyframes munch{50%{transform:scale(1.03,.94)}}
@keyframes jump{30%{transform:translateY(-58%)}55%{transform:translateY(-58%)}100%{transform:none}}
@keyframes slip{30%{transform:rotate(-70deg) translateY(10%)}70%{transform:rotate(-70deg) translateY(10%)}100%{transform:none}}
@keyframes pop{40%{transform:scale(1.08,.92)}70%{transform:scale(.96,1.05)}}
.plate{position:absolute;top:100%;left:50%;transform:translateX(-50%);margin-top:calc(var(--u)*.3);white-space:nowrap;font-weight:800;color:#5a3d22;
  font-size:calc(var(--u)*1.55);display:flex;align-items:center;gap:calc(var(--u)*.45);text-shadow:0 1px 0 #fff,0 0 calc(var(--u)*.6) #fff;pointer-events:none}
.plate b{background:radial-gradient(circle at 35% 30%,#fff2a8,var(--gold) 60%,var(--gold-d));border:calc(var(--u)*.22) solid #fff;border-radius:50%;
  width:calc(var(--u)*2.5);height:calc(var(--u)*2.5);display:grid;place-items:center;font-size:calc(var(--u)*1.2);color:#6b4708;text-shadow:none}
.bubble{position:absolute;bottom:97%;left:50%;transform:translateX(-50%);background:#fff;border:calc(var(--u)*.3) solid #e3b54a;border-radius:calc(var(--u)*2);
  padding:calc(var(--u)*.35) calc(var(--u)*1.2);font-weight:700;color:#5a3d22;white-space:nowrap;font-size:calc(var(--u)*1.6);z-index:5;
  box-shadow:0 calc(var(--u)*.3) calc(var(--u)*.6) rgba(0,0,0,.15);pointer-events:none}
.bubble::after{content:"";position:absolute;top:100%;left:50%;margin-left:calc(var(--u)*-.8);border:calc(var(--u)*.8) solid transparent;border-top-color:#e3b54a}
.bubble[hidden]{display:none}
#sponge{position:absolute;font-size:calc(var(--u)*4.5);transform:translate(-50%,-50%);pointer-events:none;z-index:2000;line-height:1}
.room.bath{cursor:none}
#ball{position:absolute;font-size:calc(var(--u)*3);transform:translate(-50%,-100%);transition:left .5s ease-out,top .5s ease-out;line-height:1;z-index:1200;pointer-events:none}

/* ---------- FX ---------- */
#fx{position:absolute;inset:0;pointer-events:none;z-index:1500}
.float{position:absolute;transform:translate(-50%,-50%);font-weight:800;font-size:calc(var(--u)*2);color:#fff;
  text-shadow:0 0 calc(var(--u)*.3) #5a3d22,0 1px 2px #5a3d22;animation:floatUp 1.3s ease-out forwards;white-space:nowrap}
@keyframes floatUp{0%{opacity:0;transform:translate(-50%,-20%) scale(.7)}15%{opacity:1;transform:translate(-50%,-50%) scale(1.1)}100%{opacity:0;transform:translate(-50%,-260%)}}
.toast{position:absolute;left:50%;top:calc(var(--u)*13);transform:translateX(-50%);background:rgba(74,51,36,.92);color:#fff;font-weight:700;
  padding:calc(var(--u)*.5) calc(var(--u)*1.8);border-radius:calc(var(--u)*3);font-size:calc(var(--u)*1.6);animation:toast 2.2s ease forwards;white-space:nowrap}
@keyframes toast{0%{opacity:0;transform:translate(-50%,30%)}10%,80%{opacity:1;transform:translate(-50%,0)}100%{opacity:0}}
.bub{position:absolute;width:calc(var(--u)*2);height:calc(var(--u)*2);border-radius:50%;border:2px solid rgba(255,255,255,.95);
  background:radial-gradient(circle at 30% 30%,#fff,rgba(180,225,255,.5));animation:bub 1s ease-out forwards}
@keyframes bub{to{opacity:0;transform:translateY(calc(var(--u)*-6)) scale(1.6)}}

/* ---------- Overlay / modal ---------- */
#overlay:empty{display:none}
.modalbg{position:absolute;inset:0;background:rgba(30,40,60,.45);z-index:3000;display:grid;place-items:center;padding:calc(var(--u)*2)}
.modal{position:relative;width:min(100%,calc(var(--u)*70));max-height:100%;display:flex;flex-direction:column;padding:calc(var(--u)*1.6) calc(var(--u)*2) calc(var(--u)*2);animation:modalIn .22s ease-out}
@keyframes modalIn{from{transform:scale(.9);opacity:0}}
.modal h2{margin:0 calc(var(--u)*5) calc(var(--u)*1) 0;font-size:calc(var(--u)*2.6);line-height:1.1;color:#3e6fa0}
.modal .x{position:absolute;right:calc(var(--u)*-1.2);top:calc(var(--u)*-1.2)}
.mbody{overflow:auto;min-height:0}
.mbtns{display:flex;gap:calc(var(--u)*1);justify-content:center;flex-wrap:wrap;margin-top:calc(var(--u)*1.4)}
.reward{text-align:center}
.reward p{margin:calc(var(--u)*.6) 0}
.olyrows{display:flex;flex-direction:column;gap:calc(var(--u)*.6);margin:calc(var(--u)*1) 0;width:100%}
.olyrow{display:flex;align-items:center;gap:calc(var(--u)*.8);background:#eef7fe;border:calc(var(--u)*.2) solid #bfdcf3;border-radius:calc(var(--u)*1.1);padding:calc(var(--u)*.6) calc(var(--u)*1)}
.olyrow .olyem{font-size:calc(var(--u)*2.4);line-height:1}
.olyrow b{flex:1;text-align:left;color:#3e6fa0;font-size:calc(var(--u)*1.5)}
.olyrow .olyval{color:#6b8aa6;font-weight:800;font-size:calc(var(--u)*1.3)}
.bigem{font-size:calc(var(--u)*9);line-height:1.1;animation:pop .6s ease-out}
@keyframes giftshake{0%,100%{transform:rotate(0)}20%{transform:rotate(-8deg)}40%{transform:rotate(7deg)}60%{transform:rotate(-6deg)}80%{transform:rotate(5deg)}}
.giftshake{font-size:calc(var(--u)*9);line-height:1.1;display:inline-block;animation:giftshake .35s ease-in-out infinite}
.giftburst{position:relative;display:inline-block}
.giftburst::before,.giftburst::after{content:"✨";position:absolute;font-size:calc(var(--u)*2.4);animation:sparkFly .7s ease-out}
.giftburst::before{left:-10%;top:0}
.giftburst::after{right:-10%;top:40%;animation-delay:.1s}
@keyframes sparkFly{0%{transform:scale(0) rotate(0deg);opacity:1}100%{transform:scale(1.4) rotate(45deg) translateY(calc(var(--u)*-2));opacity:0}}
.tabs{display:flex;gap:calc(var(--u)*.5);flex-wrap:wrap;margin-bottom:calc(var(--u)*1)}
.tab{border:calc(var(--u)*.25) solid #bfdcf3;background:#eef7fe;border-radius:calc(var(--u)*1.2);padding:calc(var(--u)*.2) calc(var(--u)*1.2);

// Pegá acá la config de TU proyecto Firebase (ver DEPLOY.md). No es secreta:
// la config web de Firebase está pensada para ser pública; lo que protege
// los datos son las reglas de seguridad de Firestore, no ocultar esta config.
const FIREBASE_CONFIG={apiKey:"AIzaSyA-9SJoYRiF7PWIqzZtvteBHhhuoXl5ljE",authDomain:"villa-mascota-pet.firebaseapp.com",projectId:"villa-mascota-pet",storageBucket:"villa-mascota-pet.firebasestorage.app",messagingSenderId:"808924771168",appId:"1:808924771168:web:044aa2547cfc937c172405"};
let fbReady=false,fbAuthUid=null,friendCache={},syncTimer=null;
function fbInit(){
  if(fbReady||typeof firebase==='undefined')return fbReady;
  try{firebase.initializeApp(FIREBASE_CONFIG);fbReady=true;}catch(e){console.warn('Firebase no disponible',e);}
  return fbReady;
}
async function fbAuth(){
  if(!fbInit())return null;
  if(fbAuthUid)return fbAuthUid;
  try{const cred=await firebase.auth().signInAnonymously();fbAuthUid=cred.user.uid;return fbAuthUid;}
  catch(e){console.warn('No se pudo iniciar sesión anónima',e);return null;}
}
function genFriendCode(){const ch='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';let s='';for(let i=0;i<6;i++)s+=ch[Math.floor(Math.random()*ch.length)];return s;}
let friendCodeInFlight=null;
// Una vez asignado, S.friendCode queda fijo para siempre (se guarda en localStorage).
// El candado friendCodeInFlight evita que dos clicks rápidos generen dos códigos distintos.
function ensureFriendCode(){
  if(S.friendCode)return Promise.resolve(S.friendCode);
  if(friendCodeInFlight)return friendCodeInFlight;
  friendCodeInFlight=(async()=>{
    const uid=await fbAuth();if(!uid){friendCodeInFlight=null;return null;}
    if(S.friendCode)return S.friendCode;
    const db=firebase.firestore();let code=null;
    for(let i=0;i<6;i++){
      const c=genFriendCode();
      try{const snap=await db.collection('players').doc(c).get();if(!snap.exists){code=c;break;}}catch(e){console.warn('No se pudo verificar el código',e);friendCodeInFlight=null;return null;}
    }
    friendCodeInFlight=null;
    if(!code)return null;
    S.friendCode=code;save();
    await syncMyHouse();
    return code;
  })();
  return friendCodeInFlight;
}
function scheduleSync(){
  if(!S.friendCode)return;
  clearTimeout(syncTimer);
  syncTimer=setTimeout(syncMyHouse,2500);
}
async function syncMyHouse(){
  if(!S.friendCode)return;
  const uid=await fbAuth();if(!uid)return;
  try{
    await firebase.firestore().collection('players').doc(S.friendCode).set({
      uid,name:S.pet.name,level:S.level,pet:S.pet,outfit:S.outfit,wall:S.wall,floor:S.floor,placed:S.placed,
      updatedAt:firebase.firestore.FieldValue.serverTimestamp()
    });
  }catch(e){console.warn('No se pudo sincronizar la casa',e);}
}
async function fetchFriend(code){
  if(!fbInit())return null;
  try{const snap=await firebase.firestore().collection('players').doc(code).get();return snap.exists?snap.data():null;}
  catch(e){console.warn('No se pudo buscar ese código',e);return null;}
}

/* ---------------- GRAVEDAD / SUPERFICIES ----------------
   Los muebles de pared (cuadro, reloj) se cuelgan libremente, sin gravedad.
   El resto de los muebles cae al piso si se sueltan en el aire; si se sueltan
   sobre un mueble "superficie" (sofá, cama, silla) quedan apoyados encima,
   y lo siguen si ese mueble se mueve. */
const WALL_ITEMS=new Set(['cuadro','reloj','estante']);
// Muebles grandes: nunca se apoyan sobre otra superficie (p.ej. la cama no entra en el sillón).
const BIG_ITEMS=new Set(['sofa','cama','castillo','carrusel','barco']);
const SURFACES={sofa:{lift:22,span:36},cama:{lift:18,span:40},silla:{lift:24,span:18},estante:{lift:17,span:22}};
// El piso empieza donde termina la pared (ver .floor top:61% / .base top:57.5%): dentro de esa franja hay libertad total.
const FLOOR_MIN=64,FLOOR_MAX=97;
function findSurface(x,y,excludeUid){
  let best=null,bestD=Infinity;
  for(const p of S.placed){
    if(p.uid===excludeUid)continue;
    const cfg=SURFACES[p.id];if(!cfg)continue;
    const span=cfg.span*HOUSE_SCALE;
    const dx=Math.abs(x-p.x);if(dx>span)continue;
    if(y<p.y-cfg.lift-10||y>p.y+6)continue;
    if(dx<bestD){bestD=dx;best=p;}
  }
  return best;
}
function settleFurn(f,rawX,rawY){
  if(WALL_ITEMS.has(f.id)){f.x=rawX;f.y=rawY;f.restingOn=null;return;}
  const parent=BIG_ITEMS.has(f.id)?null:findSurface(rawX,rawY,f.uid);
  if(parent){
    const cfg=SURFACES[parent.id];const span=cfg.span*HOUSE_SCALE;
    f.restingOn=parent.uid;
    f.x=clamp(rawX,parent.x-span,parent.x+span);
    f.y=parent.y-cfg.lift;
    f._dx=f.x-parent.x;
  }else{
    // sin superficie debajo: libertad total sobre el piso, pero nunca "flotando" arriba de donde empieza
    f.restingOn=null;f.x=rawX;f.y=clamp(rawY,FLOOR_MIN,FLOOR_MAX);
  }
}
function furnZIndex(f){
  if(f.restingOn){const p=S.placed.find(x=>x.uid===f.restingOn);if(p)return Math.round(p.y*10)+5;}
  return Math.round(f.y*10);
}

  const f=v=>Math.max(0,Math.min(255,Math.round(amt<0?v*(1+amt):v+(255-v)*amt)));

// Hitos acumulados de por vida por juego: 10/50/100/200, premio que se duplica en cada hito.
const ACH_TIERS=[10,50,100,200];
const ACH_BASE={coins:250,cash:5};
const ACH_INFO={
  bananas:{n:'Bananas esquivadas',e:'🍌'},
  longjumps:{n:'Saltos en largo',e:'📏'},
  clays:{n:'Platos acertados',e:'🥏'},
};
// Los logros se guardan en cola y se muestran recién cuando termina el juego (flushAchievements),
// nunca interrumpen mientras se está corriendo/saltando/disparando.
let pendingAch=[],_flushAchAfter=null;
function bumpAchievement(key,n=1){
  S.achieve=S.achieve||{};
  const a=S.achieve[key]=S.achieve[key]||{count:0,tiers:[]};
  a.count+=n;
  ACH_TIERS.forEach((t,i)=>{
    if(a.count>=t&&!a.tiers.includes(t)){
      a.tiers.push(t);
      const mult=Math.pow(2,i),coins=ACH_BASE.coins*mult,cash=ACH_BASE.cash*mult;
      S.coins+=coins;S.cash+=cash;updateHUD();save();
      const info=ACH_INFO[key]||{n:key,e:'🏅'};
      pendingAch.push({info,t,coins,cash});
    }
  });
}
function flushAchievements(after){
  if(!pendingAch.length){if(after)after();return;}
  const a=pendingAch.shift();_flushAchAfter=after;snd('lvl');
  modal('¡Logro desbloqueado!',`<div class="reward"><div class="bigem">${a.info.e}</div><p><b>${a.info.n}</b>: ${a.t}</p><p>Premio: <b>${a.coins} 🪙</b> y <b>${a.cash} 💵</b></p></div><div class="mbtns"><button class="btn green" data-act="flushAch">¡Genial!</button></div>`);
}

function initRoomCamera(){
  const room=$('#room');if(!room)return;
  const max=Math.max(0,room.offsetWidth-stage.clientWidth);
  camera.x=-max/2;
  room.style.transform=`translateX(${camera.x}px)`;
}
function roomPanStart(e){const room=$('#room');if(!room)return;pan={startX:e.clientX,camStart:camera.x,moved:false,room};}
function roomPanMove(e){
  if(!pan)return;const dx=e.clientX-pan.startX;
  if(Math.abs(dx)>6)pan.moved=true;
  const max=Math.max(0,pan.room.offsetWidth-stage.clientWidth);
  camera.x=clamp(pan.camStart+dx,-max,0);
  pan.room.style.transform=`translateX(${camera.x}px)`;
}
function roomPanEnd(){if(pan&&pan.moved){justPanned=true;setTimeout(()=>{justPanned=false;},0);}pan=null;}
function fridgeHTML(){
  const foods=Object.keys(S.inv).filter(k=>S.inv[k]>0&&ITEMS[k]?.t==='food');
  if(!foods.length)return `<p class="muted">La heladera está vacía. Comprá algo en el supermercado o cosechá en el jardín.</p><div class="mbtns"><button class="btn green" data-act="go" data-arg="shop:food">Ir al supermercado</button></div>`;
  const rows=[];for(let i=0;i<foods.length;i+=5)rows.push(foods.slice(i,i+5));
  return `<div class="fridgeint">${rows.map(row=>`<div class="fshelf">${row.map(k=>`<button class="fitem" data-act="feedPick" data-arg="${k}" title="${ITEMS[k].n}">${itemIcon(k)}<span class="qty">x${S.inv[k]}</span></button>`).join('')}</div>`).join('')}</div>
    <p class="muted" style="text-align:center">Tocá un alimento para dárselo a ${esc(S.pet.name)}.</p>`;
}

function shopItems(kind,tab){
  return Object.keys(ITEMS).filter(k=>{const it=ITEMS[k];if(it.shop!==(kind==='cafe'?'cafe':kind))return false;
    if(kind==='cloth')return tab==='special'?it.t==='special':it.slot===tab;
    if(kind==='furn')return it.t===tab;return true;});
}
function shopHTML(kind){
  const K=KEEPERS[kind];if(!shopTab)shopTab=SHOPTABS[kind][0][0];
  let view=`<div class="svwall" style="--wallbg:${K.wall}"></div><div class="svfloor" style="--floorbg:${K.floor}"></div>`;
  view+=K.shelves.map(([s,t])=>`<div class="shelf" style="top:${t}%;${kind==='cafe'?'right:44%':''}">${[...s].filter(c=>c.trim()).join('</span><span>').replace(/^/,'<span>')+'</span>'}</div>`).join('');

  view+=petHTML('keeper',K.look,K.outfit,K.name,'','small static');
  view+=`<div class="counter"></div>`;
  if(kind==='cloth')view+=`<div class="spot2"></div><div class="podium2"></div>`;
  if(kind==='cafe'){view+=petHTML('npcA',NEIGHBORS[1].look,NEIGHBORS[1].outfit,NEIGHBORS[1].name,NEIGHBORS[1].lvl,'tiny static');}
  view+=petHTML('pet',S.pet,kind==='cloth'?tryOutfit():S.outfit,S.pet.name,S.level,kind==='cloth'?'small':'small');

const LANES=[49,63,78];

function raceInit(){
  OLY={race:null,longjump:null,skeet:null,shown:false};
  const rivals=shuffle(NEIGHBORS).slice(0,2);
  R={phase:'ready',t:0,rivals,finished:[],
     racers:[{u:0,v:0,jumpT:0,stunT:0,done:false,lane:2,base:rnd(9,10.6)},{u:0,v:0,jumpT:0,stunT:0,done:false,lane:0,base:rnd(8.4,10.4)},{u:0,v:0,jumpT:0,stunT:0,done:false,lane:1,base:rnd(8.2,10.2)}],
     bananas:[[27,2],[49,2],[73,2],[36,0],[64,0],[88,0],[16,1],[44,1],[80,1]].map(([u,lane])=>({u,lane,hit:false}))};
  let h=R.bananas.map((b,i)=>`<span class="banana" id="bn${i}" style="left:${6+b.u*.85}%;top:${LANES[b.lane]-1}%;z-index:${LANES[b.lane]*10-1}">🍌</span>`).join('');
  h+=petHTML('rc1',rivals[0].look,rivals[0].outfit,rivals[0].name,rivals[0].lvl,'tiny static');
  h+=petHTML('rc2',rivals[1].look,rivals[1].outfit,rivals[1].name,rivals[1].lvl,'tiny static');
  h+=petHTML('rc0',S.pet,S.outfit,S.pet.name,S.level,'tiny static',{mood:'happy',clean:S.stats.clean});

}
function placeRacer(i){const r=R.racers[i],el=$('#rc'+i);if(!el)return;el.style.left=(6+r.u*.85)+'%';el.style.top=LANES[r.lane]+'%';el.style.zIndex=LANES[r.lane]*10;
  const run=R.phase==='run'&&r.v>1&&!r.done&&r.stunT<=0;if(el._run!==run){el._run=run;el.classList.toggle('running',run);el.classList.toggle('idle',!run);}}
function racerAnim(i,cls,ms){const el=$('#rc'+i);if(!el)return;el.classList.remove(cls);void el.offsetWidth;el.classList.add(cls);setTimeout(()=>el.classList.remove(cls),ms);}
function raceStep(dt){
  if(!R||R.phase!=='run')return;R.t+=dt;
  R.racers.forEach((r,i)=>{
    if(r.done)return;
    if(r.stunT>0){r.stunT-=dt;r.v*=Math.exp(-2.4*dt);}
    else{const target=r.base+Math.sin(R.t*1.7+i*2)*1.2;r.v+=(target-r.v)*Math.min(1,dt*2);}
    if(r.jumpT>0)r.jumpT-=dt;
    if(i>0)for(const b of R.bananas)if(b.lane===r.lane&&b.u-r.u>0&&b.u-r.u<2.6&&r.jumpT<=0){r.jumpT=.6;racerAnim(i,'jumping',600);}
    r.u+=r.v*dt;
    if(i===0&&r.jumpT<=0)R.bananas.forEach((b,bi)=>{if(b.lane===2&&!b.hit&&Math.abs(b.u-r.u)<1.4){b.hit=true;r.stunT=.5;r.v*=.4;racerAnim(0,'slip',700);$('#bn'+bi)?.classList.add('hit');snd('bad');}});
    if(i===0&&r.jumpT>0)R.bananas.forEach(b=>{if(b.lane===2&&!b.hit&&!b.cleared&&Math.abs(b.u-r.u)<1.4){b.cleared=true;bumpAchievement('bananas',1);}});
    if(r.u>=100){r.u=100;r.done=true;R.finished.push(i);if(i===0)raceEnd();}
    placeRacer(i);
  });
}
function raceJump(){if(!R||R.phase!=='run')return;const r=R.racers[0];if(r.jumpT>-.25&&r.jumpT>0)return;if(r.done)return;r.jumpT=1;racerAnim(0,'jumping',1000);snd('pop');}
function raceEnd(){
  R.phase='end';const place=R.finished.indexOf(0)+1;
  const coins=[120,60,25][place-1],xp=[25,15,8][place-1];
  if(place===1)S.wins=(S.wins||0)+1;
  if(OLY)OLY.race={medal:['gold','silver','bronze'][place-1],label:['1er puesto','2do puesto','3er puesto'][place-1]};
  later(()=>{
    S.coins+=coins;snd(place===1?'lvl':'coin');updateHUD();
    modal(place===1?'¡Primer puesto!':place===2?'¡Segundo puesto!':'Tercer puesto',`<div class="reward"><div class="bigem">${['🥇','🥈','🥉'][place-1]}</div>
      <p>${esc(S.pet.name)} terminó en ${R.t.toFixed(1)} segundos.</p><p>Premio: <b>${coins} 🪙</b> y <b>${xp} de experiencia</b></p>
      <p class="muted">Carreras ganadas: ${S.wins||0}</p></div>
      <div class="mbtns"><button class="btn" data-act="raceEndGo" data-arg="map">Volver al mapa</button><button class="btn" data-act="raceEndGo" data-arg="race">Otra carrera</button><button class="btn green" data-act="raceEndGo" data-arg="longjump">Salto en largo →</button></div>`);
    addXP(xp);
  },700);
}

/* ---------------- SALTO EN LARGO ---------------- */
// La mascota corre sola (impulso base). "Acelerar" se mantiene apretado para tomar más
// velocidad (sube mientras se aprieta, baja sola al soltar); un solo toque en "Saltar"
// usa la velocidad del momento para definir qué tan lejos llega. El salto SIEMPRE lo
// decide el chico: si se pasa de la línea sin saltar, es falta (como en el salto en
// largo real) y hay que intentarlo de nuevo.
let LJ=null;
const LJ_LINE=49,LJ_BASE=6.2,LJ_MAXV=15,LJ_ACCEL=9,LJ_DECAY=.1,LJ_ANGSPD=65,LJ_MAXRUN=94;
function longjumpHTML(){
  return `<div class="ljstadium">
    <div class="ljsun"></div><div class="ljcrowd"></div>
    <div class="ljground"><div class="ljtrack"></div><div class="ljpit"></div><div class="ljline"></div><div class="ljflag"></div></div>
    ${petHTML('ljpet',S.pet,S.outfit,S.pet.name,S.level,'tiny static',{mood:'happy',clean:S.stats.clean})}
    <div class="ljangle" id="ljangle" style="left:50%;top:64%;display:none"></div>
    <div class="ljdist" id="ljdist">0.0 m</div>
    <div class="ljmeterwrap"><div class="ljmlbl">Velocidad</div><div class="ljmeter"><i id="ljmeteri" style="width:0%"></i></div></div>
    <div class="racehelp panel" id="ljhelp">Mantené “Acelerar” para tomar impulso y tocá “Saltar” cuando quieras</div>
    <div class="raceexit"><button class="dbtn" data-act="go" data-arg="map"><span class="rbtn">${dic('mapa')}</span><em>Mapa</em></button></div>
    <div class="ljbtns">
      <button class="rbtn ljbtn ljaccel" id="ljaccelbtn" aria-label="Acelerar"><span>⚡</span>Acelerar</button>
      <button class="rbtn ljbtn ljjump" id="ljjumpbtn" aria-label="Saltar"><span>⤴️</span>Saltar</button>
    </div>
  </div>`;
}
function longjumpInit(){
  LJ={phase:'run',u:0,v:LJ_BASE,accel:false,angle:0,angleDir:1};
  placeLJPet();
}
function placeLJPet(){
  const el=$('#ljpet');if(!el||!LJ)return;
  el.style.left=(6+Math.min(LJ.u,100)*.9)+'%';el.style.top='64%';el.style.zIndex=700;
}
function longjumpStep(dt){
  if(!LJ)return;
  if(LJ.phase==='run'){
    const target=LJ.accel?LJ_MAXV:LJ_BASE,rate=LJ.accel?LJ_ACCEL:LJ_DECAY;
    LJ.v+=(target-LJ.v)*Math.min(1,rate*dt);
    LJ.u=Math.min(LJ_MAXRUN,LJ.u+LJ.v*dt);
    const pct=clamp((LJ.v-LJ_BASE)/(LJ_MAXV-LJ_BASE)*100,0,100);
    const m=$('#ljmeteri');if(m)m.style.width=pct+'%';
    placeLJPet();
    if(LJ.u>=LJ_LINE)longjumpFoul();
  }else if(LJ.phase==='aiming'){
    LJ.angle+=LJ.angleDir*LJ_ANGSPD*dt;
    if(LJ.angle>=90){LJ.angle=90;LJ.angleDir=-1;}
    if(LJ.angle<=0){LJ.angle=0;LJ.angleDir=1;}
    const ang=$('#ljangle');if(ang)ang.style.transform=`rotate(${-LJ.angle}deg)`;
  }
}
// 1er toque en "Saltar": frena y muestra la línea de ángulo, esperando al chico.
function longjumpAim(){
  if(!LJ||LJ.phase!=='run')return;
  LJ.phase='aiming';LJ.jumpSpeed=LJ.v;LJ.angle=0;LJ.angleDir=1;
  const ang=$('#ljangle');if(ang){ang.style.display='block';ang.style.transform='rotate(0deg)';}
  const jb=$('#ljjumpbtn');if(jb)jb.innerHTML='<span>👆</span>¡Ahora!';
  const ab=$('#ljaccelbtn');if(ab)ab.style.opacity='.4';
  const h=$('#ljhelp');if(h)h.textContent='Tocá de nuevo cuando te guste el ángulo';
  snd('pop');
}
// 2do toque: usa el ángulo elegido en ese instante.
function longjumpConfirmJump(){
  if(!LJ||LJ.phase!=='aiming')return;
  longjumpDoJump(LJ.jumpSpeed,LJ.angle);
}
// Si cruza la línea sin haber saltado, es falta: hay que intentarlo de nuevo.
function longjumpFoul(){
  if(!LJ||LJ.phase!=='run')return;
  LJ.phase='end';
  snd('bad');
  modal('¡Te pasaste!',`<div class="reward"><div class="bigem">🚫</div><p>Pero la pucha, ¡te pasaste de la línea! Inténtalo de nuevo.</p></div>
    <div class="mbtns"><button class="btn" data-act="ljEndGo" data-arg="map">Volver al mapa</button><button class="btn green" data-act="ljEndGo" data-arg="longjump">Intentar de nuevo</button></div>`);
}
function longjumpDoJump(speed,angle){
  LJ.phase='jumping';
  const angleFactor=Math.max(.35,Math.sin(2*angle*Math.PI/180));
  const dist=Math.max(1,Math.round(speed*4.2*angleFactor)/10);
  $('#ljangle')?.remove();
  const pel=$('#ljpet');if(pel){pel.classList.remove('jumping');void pel.offsetWidth;pel.classList.add('jumping');setTimeout(()=>pel.classList.remove('jumping'),1000);}
  snd('pop');
  const startU=LJ.u,endU=Math.min(98,LJ_LINE+6+(speed-LJ_BASE)*1.6),t0=performance.now();
  (function anim(){
    if(!LJ||LJ.phase!=='jumping')return;
    const t=Math.min(1,(performance.now()-t0)/900);
    LJ.u=startU+(endU-startU)*t;placeLJPet();
    if(t<1)requestAnimationFrame(anim);else longjumpLand(dist);
  })();
}
function longjumpLand(dist){
  if(!LJ)return;LJ.phase='end';
  const d=$('#ljdist');if(d)d.textContent=dist.toFixed(1)+' m';
  bumpAchievement('longjumps',1);
  if(OLY)OLY.longjump={medal:dist>=4.5?'gold':dist>=3?'silver':'bronze',label:dist.toFixed(1)+' m'};
  const coins=Math.round(dist*18);
  later(()=>{
    S.coins+=coins;snd('coin');updateHUD();
    modal('¡Buen salto!',`<div class="reward"><div class="bigem">📏</div><p>${esc(S.pet.name)} saltó <b>${dist.toFixed(1)} metros</b>.</p><p>Premio: <b>${coins} 🪙</b></p></div>
      <div class="mbtns"><button class="btn" data-act="ljEndGo" data-arg="map">Volver al mapa</button><button class="btn" data-act="ljEndGo" data-arg="longjump">Saltar de nuevo</button><button class="btn green" data-act="ljEndGo" data-arg="skeet">Tiro al plato →</button></div>`);
    addXP(6);save();
  },500);
}

    <div class="skhelp panel" id="skhelp">Tocá los platos apenas aparezcan</div>

function skeetInit(){
  SK={spawned:0,hits:0,resolved:0,active:null,ended:false};
  const pw=$('#skpet');if(pw){pw.style.left='46%';pw.style.top='97%';pw.style.zIndex=1;}
  skeetSpawnNext();
}
function skeetSpawnNext(){
  if(!SK||SK.ended)return;
  if(SK.spawned>=SK_TOTAL){skeetMaybeEnd();return;}
  SK.spawned++;
  const dir=Math.random()<.5?1:-1;
  const x0=dir===1?-8:108,x1=dir===1?108:-8;
  const y0=rnd(55,75),peak=rnd(14,28);
  const uid=++S.uid;
  SK.active={uid,x0,y0,x1,peak,dir,born:performance.now(),hit:false,missed:false};
  const el=document.createElement('div');
  el.className='clay';el.id='clay'+uid;el.dataset.act='skeetShoot';el.dataset.arg=uid;
  el.innerHTML=claySVG();
  el.style.left=x0+'%';el.style.top=y0+'%';
  $('#skclays')?.appendChild(el);
}
function skeetStep(){
  if(!SK||!SK.active)return;
  const a=SK.active,t=Math.min(1,(performance.now()-a.born)/(SK_DUR*1000));
  const x=a.x0+(a.x1-a.x0)*t,y=a.y0-a.peak*4*t*(1-t);
  const el=$('#clay'+a.uid);
  if(el&&!a.hit){el.style.left=x+'%';el.style.top=y+'%';}
  if(t>=1&&!a.hit){
    a.missed=true;el?.remove();SK.active=null;SK.resolved++;
    later(()=>skeetSpawnNext(),400);
  }
}
function skeetShoot(uid){
  if(!SK||!SK.active||SK.active.uid!==uid||SK.active.hit)return;
  const a=SK.active,el=$('#clay'+uid);if(!el)return;
  a.hit=true;SK.hits++;SK.resolved++;
  bumpAchievement('clays',1);
  const r=el.getBoundingClientRect(),sr=stage.getBoundingClientRect();
  const cx=(r.left+r.width/2-sr.left)/sr.width*100,cy=(r.top+r.height/2-sr.top)/sr.height*100;
  skeetFire(cx,cy);
  el.classList.add('popping');
  skeetShatter(cx,cy);
  setTimeout(()=>el.remove(),350);
  const sc=$('#skscore');if(sc)sc.textContent=`🎯 ${SK.hits}/${SK_TOTAL}`;
  SK.active=null;
  later(()=>skeetSpawnNext(),350);
}
function skeetFire(cx,cy){
  const m=$('#skmuzzle');if(m){m.classList.remove('fire');void m.offsetWidth;m.classList.add('fire');}
  const shot=document.createElement('div');
  shot.className='shot';shot.style.left='52.9%';shot.style.bottom='calc(var(--u)*8)';
  $('.skstadium')?.appendChild(shot);
  shot.style.transition='left .18s linear, top .18s linear, bottom .18s linear';
  requestAnimationFrame(()=>{shot.style.bottom='auto';shot.style.left=cx+'%';shot.style.top=cy+'%';});
  setTimeout(()=>shot.remove(),220);
  snd('pop');
}
function skeetShatter(cx,cy){
  const colors=['#c9654b','#8a3a28','#e08a6a'];
  const wrap=$('.skstadium');if(!wrap)return;
  for(let i=0;i<7;i++){
    const s=document.createElement('div');s.className='shard';
    const ang=Math.random()*Math.PI*2,dist=rnd(6,16);
    s.style.setProperty('--sx',Math.cos(ang)*dist+'cqw');
    s.style.setProperty('--sy',(Math.sin(ang)*dist+8)+'cqw');
    s.style.setProperty('--sr',rnd(-180,180)+'deg');
    s.style.left=cx+'%';s.style.top=cy+'%';
    s.style.background=colors[i%colors.length];
    wrap.appendChild(s);
    setTimeout(()=>s.remove(),620);
  }
  snd('coin');
}
function skeetMaybeEnd(){
  if(!SK||SK.ended||SK.resolved<SK_TOTAL)return;
  SK.ended=true;skeetEnd();
}
function skeetEnd(){
  const hits=SK.hits,coins=hits*35;
  if(OLY)OLY.skeet={medal:hits>=6?'gold':hits>=4?'silver':'bronze',label:hits+'/'+SK_TOTAL};
  later(()=>{
    S.coins+=coins;snd(hits>=6?'lvl':'coin');updateHUD();
    modal(hits>=6?'¡Excelente puntería!':hits>=3?'¡Buen tiro!':'¡Casi!',`<div class="reward"><div class="bigem">🥏</div><p>${esc(S.pet.name)} acertó <b>${hits} de ${SK_TOTAL}</b> platos.</p><p>Premio: <b>${coins} 🪙</b></p></div>
      <div class="mbtns"><button class="btn" data-act="skeetEndGo" data-arg="map">Volver al mapa</button><button class="btn green" data-act="skeetEndGo" data-arg="skeet">Jugar de nuevo</button></div>`);
    addXP(8);save();
  },500);
}

/* ---------------- VISIT ---------------- */
function currentVisit(){
  if(visitId&&visitId.startsWith('friend:')){
    const code=visitId.slice(7),d=friendCache[code];if(!d)return null;
    return {id:visitId,name:d.name||'Amigo',lvl:d.level||1,look:d.pet||{},outfit:d.outfit||{},wall:d.wall||'wall_cream',floor:d.floor||'floor_check',
      furn:d.placed||[],hi:'¡Hola! Bienvenido a mi casa',isFriend:true};
  }
  const nb=NEIGHBORS.find(n=>n.id===visitId);
  return nb?{...nb,isFriend:false}:null;
}
function visitHTML(){
  const nb=currentVisit();
  if(!nb)return `<div class="empty">No pudimos cargar esta casa.</div><div class="raceexit"><button class="dbtn" data-act="go" data-arg="map"><span class="rbtn">${dic('mapa')}</span><em>Mapa</em></button></div>`;
  return roomHTML(nb.wall,nb.floor,nb.furn,false,false)+petHTML('npc',nb.look,nb.outfit,nb.name,nb.lvl,'static')+petHTML()+
    `<div class="visitui"><button class="btn" data-act="greet">👋 Saludar</button>${nb.isFriend?'':'<button class="btn gold" data-act="giftNb">🎁 Dejar regalo</button>'}</div>`;
}
function visitEnter(){
  const nb=currentVisit();if(!nb)return;
  const n=$('#npc');
  if(n){n.style.left='68%';n.style.top='80%';n.style.zIndex=860;}
  later(()=>say(nb.hi,'npc',3200),400);
  if(nb.isFriend)return;
  const v=S.visits[nb.id]||{};
  if(v.day!==todayStr()){
    S.visits[nb.id]={day:todayStr(),gift:false};
    later(()=>{addCoins(25);addXP(10);
      if(Math.random()<.5){const it=pick(['dona','galleta','pastel','frutilla','helado','seed_sun']);addItem(it);toast(`${nb.name} te regaló: ${ITEMS[it].e} ${ITEMS[it].n}`);}
      else toast('Visita del día: +25 monedas');},1200);
  }
}

  const ids=Object.keys(S.inv).filter(k=>S.inv[k]>0&&ITEMS[k]&&ITEMS[k].t===invTab);
  let h=`<div class="tabs">${INVTABS.map(([k,n])=>`<button class="tab ${invTab===k?'on':''}" data-act="invTab" data-arg="${k}">${n}</button>`).join('')}</div>`;

    :`<div class="empty">Aquí no hay nada todavía. ${({food:'Compra comida en el supermercado o cosecha en el jardín.',furn:'Visita la tienda de muebles.',cloth:'Visita la boutique.',seed:'Compra semillas en el jardín.',fish:'Ve al estanque a pescar.'})[invTab]}</div>`;
  if(invSel&&S.inv[invSel]>0&&ITEMS[invSel].t===invTab){
    const it=ITEMS[invSel],sv=sellValue(invSel);let acts='';let txt='';
    if(it.t==='food'){txt=`+${it.h} 🍗 y +${it.j} ❤️`;acts+=scene==='house'&&!mode?`<button class="btn green" data-act="invUse" data-arg="${invSel}">Darle de comer</button>`:'';}
    if(it.t==='furn'){txt='Para decorar tu casa';acts+=`<button class="btn green" data-act="invPlace" data-arg="${invSel}">Colocar en casa</button>`;}
    if(it.t==='cloth'){const on=S.outfit[it.slot]===invSel;txt=on?'La tienes puesta':'Prenda de vestir';acts+=`<button class="btn green" data-act="wear" data-arg="${invSel}">${on?'Quitar':'Vestir'}</button>`;}
    if(it.t==='seed'){txt='Se planta en el jardín';acts+=`<button class="btn green" data-act="go" data-arg="garden">Ir al jardín</button>`;}
    if(it.t==='fish'){txt=`Vale ${sv} monedas`;if(S.inv[invSel]>1)acts+=`<button class="btn gold" data-act="invSellAll" data-arg="${invSel}">Vender todos (${S.inv[invSel]*sv} 🪙)</button>`;}

    h+=`<div class="detail"><span class="em">${itemIcon(invSel)}</span><div class="txt"><b>${it.n}</b>${txt}</div><div class="acts2">${acts}</div></div>`;
  }

/* ---------------- PET ACTIONS ---------------- */
function eat(id,consumeInv=true){
  const it=ITEMS[id];
  if(consumeInv){S.inv[id]--;if(S.inv[id]<=0)delete S.inv[id];}
  const was=S.stats.hunger;
  S.stats.hunger=clamp(S.stats.hunger+it.h);S.stats.joy=clamp(S.stats.joy+it.j);
  if(was<95)addXP(4);
  if(consumeInv&&Math.random()<.55)S.pendingPoops.push(Date.now()+rnd(20,60)*1000);
  updateHUD();save();snd('eat');
  const el=$('#pet');if(!el)return;
  P.busy=2.3;P.tx=P.x;P.ty=P.y;
  el.classList.add('eating');setPetFace({eating:true});
  const p=stagePos(el);const f=document.createElement('div');
  f.style.cssText=`position:absolute;left:${p.x+(P.face>0?5:-5)}%;top:${p.y+8}%;font-size:calc(var(--u)*3.6);transform:translate(-50%,-50%);transition:transform .5s;z-index:1400;pointer-events:none`;
  f.textContent=it.e;$('#fx').appendChild(f);
  later(()=>f.style.transform='translate(-50%,-50%) scale(.7)',700);
  later(()=>f.style.transform='translate(-50%,-50%) scale(.35)',1400);
  later(()=>{f.remove();el.classList.remove('eating');setPetFace({joy:true});say(pick(['¡Qué rico!','¡Mmm, delicioso!','¡Gracias!']));floatAtPet(`+${it.h} 🍗`);},2100);
  later(()=>setPetFace(),3000);
}
function petTheP(){
  const now=performance.now();if(now-petCool<600)return;petCool=now;
  const el=$('#pet');if(!el)return;
  const was=S.stats.joy;S.stats.joy=clamp(S.stats.joy+3);
  if(was<100)addXP(1);updateHUD();snd('pet');
  el.classList.remove('pop');void el.offsetWidth;el.classList.add('pop');
  setPetFace({joy:true});P.busy=1;
  const p=stagePos(el);floatText(p.x+rnd(-4,4),p.y-6,pick(['❤️','💕','💖']));
  clearTimeout(el._jt);el._jt=setTimeout(()=>setPetFace(),900);
  if(Math.random()<.3)say(pick(['¡Te quiero!','Jiji','¡Más mimos!']));
}
function placeBall(){const b=$('#ball');if(!b)return;b.style.left=ball.x+'%';b.style.top=ball.y+'%';}
function kickBall(){
  kicks++;snd('pop');
  if(kicks>=4){
    mode=null;$('#ball')?.remove();ball=null;
    S.stats.joy=clamp(S.stats.joy+15);S.stats.hunger=clamp(S.stats.hunger-5);S.stats.clean=clamp(S.stats.clean-5);
    addXP(6);render();say('¡Qué divertido!');return;
  }
  ball={x:rnd(18,86),y:rnd(71,81)};placeBall();P.busy=.45;P.tx=ball.x;P.ty=ball.y;
  setPetFace({joy:true});later(()=>setPetFace(),600);

function bathMove(e){
  const room=$('#room');if(!room)return;const r=stage.getBoundingClientRect();
  const sp=$('#sponge');if(sp){sp.style.left=((e.clientX-r.left)/r.width*100)+'%';sp.style.top=((e.clientY-r.top)/r.height*100)+'%';}
  if(!(e.pointerType==='mouse'||e.buttons))return;
  const pr=$('#pet')?.getBoundingClientRect();if(!pr)return;
  if(e.clientX>pr.left&&e.clientX<pr.right&&e.clientY>pr.top&&e.clientY<pr.bottom){
    S.stats.clean=clamp(S.stats.clean+.7);bathGain+=.7;
    if(Math.random()<.35){const fx=$('#fx');const b=document.createElement('div');b.className='bub';b.style.left=((e.clientX-r.left)/r.width*100+rnd(-3,3))+'%';b.style.top=((e.clientY-r.top)/r.height*100+rnd(-3,3))+'%';fx.appendChild(b);setTimeout(()=>b.remove(),1000);}
    if(Math.random()<.12){setPetFace({joy:true});updateHUD();}
    if(S.stats.clean>=100)bathFinish();
  }
}
function bathFinish(){
  mode=null;
  if(bathGain>=15){addXP(8);S.stats.joy=clamp(S.stats.joy+6);}
  bathGain=0;render();say('¡Qué limpito!');setPetFace({joy:true});later(()=>setPetFace(),1200);save();
}

  invPlace:a=>{closeModal();if(scene!=='house')go('house');mode='decor';A.placeFurn(a);},
  wardrobe:()=>modal('Armario',wardrobeHTML()),
  wear:a=>{const it=ITEMS[a];if(!(S.inv[a]>0))return;S.outfit[it.slot]=S.outfit[it.slot]===a?null:a;save();snd('pop');
    if(scene==='shop:cloth'){tryItem=a;setPetFace({},'pet',tryOutfit());refreshShop();}else setPetFace({joy:true});
    const o=$('#overlay');if(o&&o.innerHTML){const h=$('.modal h2',o)?.textContent;if(h==='Armario')modal('Armario',wardrobeHTML());else if(h==='Mis objetos')modal('Mis objetos',invHTML());}},
  unwear:s=>{S.outfit[s]=null;save();setPetFace();modal('Armario',wardrobeHTML());},
  collection:()=>modal('Colección de peces',collectionHTML()),
  // house
  feed:()=>{if(mode)return;const foods=Object.keys(S.inv).filter(k=>S.inv[k]>0&&ITEMS[k]?.t==='food');
    if(!foods.length){modal('No hay comida',`<p>Tu despensa está vacía. Compra algo en el supermercado o cosecha en el jardín.</p><div class="mbtns"><button class="btn green" data-act="go" data-arg="shop:food">Ir al supermercado</button><button class="btn" data-act="go" data-arg="garden">Ir al jardín</button></div>`);return;}
    modal('¿Qué le das de comer?',`<div class="grid">${foods.map(k=>`<button class="card" data-act="feedPick" data-arg="${k}"><span class="em">${ITEMS[k].e}</span><span class="nm">${ITEMS[k].n}</span><span class="note">+${ITEMS[k].h} 🍗 +${ITEMS[k].j} ❤️</span><span class="qty">x${S.inv[k]}</span></button>`).join('')}</div>`);},
  feedPick:a=>{closeModal();eat(a);},
  bath:()=>{if(mode)return;mode='bath';bathGain=0;P.tx=P.x;P.ty=P.y;render();say('¡Hora del baño!');},
  bathDone:()=>bathFinish(),
  play:()=>{if(mode)return;if(S.stats.hunger<10){say('Tengo mucha hambre para jugar');return;}
    mode='play';kicks=0;render();ball={x:rnd(25,80),y:rnd(71,81)};
    $('#scene').insertAdjacentHTML('beforeend','<div id="ball">⚽</div>');placeBall();P.busy=.3;P.tx=ball.x;P.ty=ball.y;say('¡Pelota!');},
  pethint:()=>{petTheP();},
  poop:(a,el)=>{const uid=+a;S.poops=S.poops.filter(p=>p.uid!==uid);const p=stagePos(el);el.remove();addCoins(5,p);addXP(2);},
  daily:(a,el)=>{if(!dailyAvailable())return;S.lastDaily=todayStr();el?.remove();
    const coins=rint(60,160),item=pick(['dona','pastel','helado','seed_straw','seed_sun','osito','flores','pizza','sushi']);
    S.coins+=coins;S.cash+=1;addItem(item);updateHUD();snd('lvl');
    modal('¡Regalo del día!',`<div class="reward"><div class="bigem">🎁</div><p>Recibiste <b>${coins} 🪙</b>, <b>1 💵</b> y <b>${ITEMS[item].e} ${ITEMS[item].n}</b>.</p><p class="muted">Vuelve mañana por otro regalo.</p></div><div class="mbtns"><button class="btn green" data-act="close">¡Gracias!</button></div>`);
    addXP(10);},
  // decor
  decor:()=>{if(mode)return;mode='decor';selUid=null;render();},
  decorDone:()=>{mode=null;selUid=null;save();render();},
  placeFurn:a=>{if(!(S.inv[a]>0))return;S.inv[a]--;if(S.inv[a]<=0)delete S.inv[a];
    const wall=WALL_ITEMS.has(a);
    const f={id:a,uid:++S.uid,x:rnd(30,70),y:wall?35:rnd(FLOOR_MIN+6,FLOOR_MAX-4),restingOn:null};
    S.placed.push(f);selUid=f.uid;save();snd('pop');render();},
  unplace:()=>{if(!selUid)return;const f=S.placed.find(x=>x.uid===selUid);if(!f)return;
    S.placed=S.placed.filter(x=>x.uid!==selUid);
    S.placed.forEach(c=>{if(c.restingOn===selUid){c.restingOn=null;c.y=FLOOR_MAX-6;}}); // lo que descansaba encima, cae al piso
    addItem(f.id);selUid=null;save();render();},
  applyWall:a=>{S.wall=a;save();render();},
  applyFloor:a=>{S.floor=a;save();render();},
  // shops
  shopTab:a=>{shopTab=a;refreshShop();},
  try:a=>{tryItem=a;setPetFace({joy:true},'pet',tryOutfit());refreshShop();later(()=>setPetFace({},'pet',tryOutfit()),700);},
  buy:a=>{const it=ITEMS[a];
    if((it.t==='wall'||it.t==='floor')&&S.owned.includes(a)){if(it.t==='wall')S.wall=a;else S.floor=a;save();toast(`${it.n} aplicado en tu casa`);snd('pop');return;}
    if(!canPay(it)){toast(it.c?'No tienes suficiente Pet Cash':'No tienes suficientes monedas');snd('bad');return;}
    pay(it);snd('buy');
    if(a==='mystery'){openMystery();}
    else if(it.t==='wall'||it.t==='floor'){S.owned.push(a);if(it.t==='wall')S.wall=a;else S.floor=a;toast(`Compraste ${it.n}. Ya está en tu casa.`);addXP(3);}
    else{addItem(a);toast(`Compraste ${it.n}`);addXP(2);say(pick(['¡Gracias por tu compra!','¡Excelente elección!','¡Vuelve pronto!']),'keeper');}
    updateHUD();save();refreshShop();},
  order:a=>{const it=ITEMS[a];if(!canPay(it)){toast('No tienes suficientes monedas');snd('bad');return;}
    pay(it);updateHUD();say('¡Enseguida!','keeper');later(()=>eat(a,false),400);},
  // garden
  seedshop:()=>seedModal(null),
  buySeed:a=>{const [k,plot]=a.split('|');const it=ITEMS[k];if(!canPay(it)){toast('No tienes suficientes monedas');snd('bad');return;}
    pay(it);addItem(k);snd('buy');updateHUD();save();seedModal(plot===''?null:+plot);},
  plantSeed:a=>{const [k,plot]=a.split('|');const i=+plot;if(!(S.inv[k]>0))return;S.inv[k]--;if(S.inv[k]<=0)delete S.inv[k];
    S.garden[i]={seed:k,water:false,ready:0};closeModal();addXP(2);snd('pop');refreshPlots();save();say('¡No olvides regarla!');},
  plot:a=>{const i=+a,p=S.garden[i];
    if(!p.seed){seedModal(i);return;}
    if(!p.water){p.water=true;p.ready=Date.now()+ITEMS[p.seed].grow*1000;snd('splash');addXP(2);refreshPlots();save();
      const el=document.querySelectorAll('.plot')[i];if(el){const q=stagePos(el);floatText(q.x,q.y,'💧💧');}return;}
    if(Date.now()<p.ready){toast(`Faltan ${fmtTime(p.ready-Date.now())} para cosechar`);return;}
    const it=ITEMS[p.seed];const el=document.querySelectorAll('.plot')[i];const q=el?stagePos(el):null;
    if(it.yld==='coins'){const c=rint(it.q[0],it.q[1]);addCoins(c,q);addXP(15);toast(`¡El árbol dio ${c} monedas!`);}
    else{const n=rint(it.q[0],it.q[1]);addItem(it.yld,n);addXP(6);snd('coin');if(q)floatText(q.x,q.y,`+${n} ${ITEMS[it.yld].e}`);toast(`Cosechaste ${n} ${ITEMS[it.yld].n.toLowerCase()}${n>1?'s':''}`);}
    S.garden[i]={seed:null,water:false,ready:0};refreshPlots();save();},
  // fishing
  fishBtn:()=>{
    if(FS.st==='idle'||FS.st==='done'){
      if(S.stats.hunger<8){say('Tengo mucha hambre para pescar');return;}
      S.stats.hunger=clamp(S.stats.hunger-2);updateHUD();FS.st='wait';drawLine();snd('splash');
      const sc=$('#scene');sc.insertAdjacentHTML('beforeend','<span class="ripple" style="left:64%;top:73%"></span>');setTimeout(()=>sc.querySelector('.ripple')?.remove(),1000);
      fishSet('Esperando a que pique…','⏳ Esperando');
      FS.t=later(()=>{FS.st='bite';$('#bobber')?.classList.add('bite');fishSet('¡Picó! ¡Tira ahora!','🐟 ¡Tirar ya!','gold pulse');snd('pop');
        FS.t=later(()=>{if(FS.st!=='bite')return;FS.st='done';$('#bobber')?.classList.remove('bite');drawLine();fishSet('Se escapó… Inténtalo otra vez.','🎣 Lanzar caña');},1100);},rnd(1800,5200));
      return;}
    if(FS.st==='wait'){clearTimeout(FS.t);timers.delete(FS.t);FS.st='done';drawLine();fishSet('¡Muy pronto! Espera a que el corcho se hunda.','🎣 Lanzar caña');snd('bad');return;}
    if(FS.st==='bite'){clearTimeout(FS.t);timers.delete(FS.t);FS.st='done';$('#bobber')?.classList.remove('bite');drawLine();
      const id=pickFish(),it=ITEMS[id];const first=!S.fishLog[id];
      S.fishLog[id]=(S.fishLog[id]||0)+1;addItem(id);snd('coin');
      fishSet(`Pescaste: ${it.e} ${it.n}`,'🎣 Lanzar caña');
      setPetFace({joy:true});later(()=>setPetFace(),1200);
      modal(first?'¡Nueva especie!':'¡Buena pesca!',`<div class="reward"><div class="bigem">${it.e}</div><p style="font-size:calc(var(--u)*2.2)"><b>${it.n}</b></p><p>Vale ${it.sell} 🪙. Lo guardé en tus objetos.</p></div><div class="mbtns"><button class="btn gold" data-act="sellCatch" data-arg="${id}">Vender ahora</button><button class="btn green" data-act="close">Seguir pescando</button></div>`);
      addXP(5+Math.round(it.sell/20)+(first?10:0));save();}
  },
  sellCatch:a=>{if(S.inv[a]>0){S.inv[a]--;if(S.inv[a]<=0)delete S.inv[a];S.coins+=ITEMS[a].sell;snd('coin');updateHUD();save();}closeModal();},
  // race
  flushAch:()=>{closeModal();flushAchievements(_flushAchAfter);},
  raceEndGo:a=>{closeModal();flushAchievements(()=>A.go(a));},
  ljAccelDown:()=>{if(LJ&&LJ.phase==='run'){LJ.accel=true;$('#ljaccelbtn')?.classList.add('on');}},
  ljAccelUp:()=>{if(LJ)LJ.accel=false;$('#ljaccelbtn')?.classList.remove('on');},
  ljJump:()=>{if(!LJ)return;if(LJ.phase==='run')longjumpAim();else if(LJ.phase==='aiming')longjumpConfirmJump();},
  ljEndGo:a=>{closeModal();flushAchievements(()=>A.go(a));},
  skeetShoot:a=>{skeetShoot(+a);},
  skeetRestart:()=>{go('skeet');},
  skeetEndGo:a=>{closeModal();flushAchievements(()=>{
    if(a==='map'&&OLY&&!OLY.shown&&OLY.race&&OLY.longjump&&OLY.skeet){OLY.shown=true;showOlympicsSummary();}
    else A.go(a);
  });},
  olyGo:a=>{closeModal();A.go(a);},
  raceStart:()=>{
    if(!R||R.phase!=='ready')return;
    if(S.stats.hunger<15){snd('bad');modal('¡Mucha hambre para correr!',`<div class="reward"><div class="bigem">🍗</div><p><b>${esc(S.pet.name)}</b> está demasiado cansada y con hambre para correr. Hay que darle de comer primero.</p></div><div class="mbtns"><button class="btn" data-act="go" data-arg="map">Volver al mapa</button><button class="btn green" data-act="feed">Darle de comer</button></div>`);return;}
    S.stats.hunger=clamp(S.stats.hunger-8);S.stats.clean=clamp(S.stats.clean-12);S.stats.joy=clamp(S.stats.joy+5);updateHUD();
    R.phase='count';$('#racehelp')?.remove();
    $('.raceui').innerHTML=`<button class="rbtn racebtn big" id="bjump" aria-label="Saltar"><span>⤴️</span>Saltar</button>`;
    const sc=$('#scene');const cnt=n=>{sc.querySelector('.count')?.remove();if(n===0){sc.insertAdjacentHTML('beforeend','<div class="count">¡Ya!</div>');R.phase='run';snd('go');later(()=>sc.querySelector('.count')?.remove(),700);return;}
      sc.insertAdjacentHTML('beforeend',`<div class="count">${n}</div>`);snd('pop');later(()=>cnt(n-1),750);};cnt(3);
  },
  // cocina
  openKitchenDecor:()=>modal('Decorar cocina',kitchenDecorHTML()),
  applyKWall:a=>{S.kwall=a;save();render();},
  applyKFloor:a=>{S.kfloor=a;save();render();},
  openFridge:()=>modal('Heladera',fridgeHTML()),
  useToaster:()=>modal('Tostadora',`<p>¿Qué le agregás a la tostada de ${esc(S.pet.name)}?</p><div class="grid">${TOAST_OPTIONS.map(([k,n])=>`<button class="card" data-act="toastPick" data-arg="${k}"><span class="em">${itemIcon(k)}</span><span class="nm">${n}</span></button>`).join('')}</div>`),
  toastPick:a=>{closeModal();snd('pop');say('¡Tostadas calentitas!');later(()=>eat(a,false),400);},
  // neighbors
  neighbors:()=>modal('Vecinos',neighborsHTML()),
  getCode:async()=>{toast('Generando tu código…');const c=await ensureFriendCode();refreshNeighborsModal();toast(c?`¡Tu código es ${c}!`:'No se pudo generar el código. Probá de nuevo.');},
  copyCode:()=>{if(!S.friendCode)return;(navigator.clipboard?.writeText(S.friendCode)||Promise.reject()).then(()=>toast('Código copiado')).catch(()=>toast('Tu código: '+S.friendCode));},
  addFriendGo:async()=>{
    const inp=$('#friendcodeinput');const code=(inp?.value||'').trim().toUpperCase();
    if(!code){toast('Escribí un código primero');return;}
    if(code===S.friendCode){toast('Ese es tu propio código');return;}
    if((S.friends||[]).some(f=>f.code===code)){toast('Ya es tu amigo');return;}
    toast('Buscando…');
    const d=await fetchFriend(code);
    if(!d){toast('No encontramos ese código');return;}
    S.friends=S.friends||[];S.friends.push({code,name:d.name||'Amigo'});save();
    refreshNeighborsModal();toast(`¡Agregaste a ${d.name||'tu amigo'}!`);
  },
  visitFriend:async(code)=>{
    toast('Entrando a la casa…');
    const d=await fetchFriend(code);
    if(!d){toast('No pudimos cargar esa casa ahora. Probá más tarde.');return;}
    friendCache[code]=d;closeModal();visitId='friend:'+code;go('visit:friend:'+code);
  },
  visit:a=>{visitId=a;closeModal();go('visit:'+a);},
  greet:()=>{const nb=NEIGHBORS.find(n=>n.id===visitId);snd('pet');petTheP();say(pick(['¡Hola!','¡Qué lindo verte!','¿Cómo estás?']),'pet',2000);
    later(()=>{say(pick(['¡Hola, '+S.pet.name+'!','¡Me encanta tu ropa!','¡Ven cuando quieras!']),'npc',2400);floatAtPet('💕','npc');},900);},
  giftNb:()=>{const nb=NEIGHBORS.find(n=>n.id===visitId);const v=S.visits[nb.id]||{};
    if(v.gift){say('¡Ya me diste un regalo hoy, gracias!','npc');return;}
    const foods=Object.keys(S.inv).filter(k=>S.inv[k]>0&&ITEMS[k]?.t==='food');
    if(!foods.length){toast('No tienes comida para regalar');return;}
    modal(`Regalo para ${nb.name}`,`<p>Elige algo para regalar. Los vecinos siempre devuelven el favor.</p><div class="grid">${foods.map(k=>`<button class="card" data-act="giftPick" data-arg="${k}"><span class="em">${ITEMS[k].e}</span><span class="nm">${ITEMS[k].n}</span><span class="qty">x${S.inv[k]}</span></button>`).join('')}</div>`);},
  giftPick:a=>{const nb=NEIGHBORS.find(n=>n.id===visitId);closeModal();S.inv[a]--;if(S.inv[a]<=0)delete S.inv[a];
    S.visits[nb.id]=Object.assign(S.visits[nb.id]||{day:todayStr()},{gift:true});
    say(`¡Gracias por la ${ITEMS[a].n.toLowerCase()}!`,'npc',2800);floatAtPet('💝','npc');
    later(()=>{const c=Math.round(sellValue(a)*2+20);addCoins(c);addXP(8);toast(`${nb.name} te devolvió el favor con ${c} monedas`);},1200);save();},
};
function toastCreate(t){let d=$('#ctoast');if(!d){d=document.createElement('div');d.id='ctoast';d.className='toast';stage.appendChild(d);}d.textContent=t;d.style.animation='none';void d.offsetWidth;d.style.animation='';setTimeout(()=>d.remove(),2300);}
function openMystery(){
  const r=pick(MYSTERY);
  modal('¡Caja misteriosa!','<div class="reward"><div class="giftshake">🎁</div><p class="muted">Abriendo…</p></div>');
  snd('pop');
  later(()=>{
    let content;
    if(r==='coins'){const c=rint(400,900);S.coins+=c;content=`<div class="giftburst"><div class="bigem">💰</div></div><p>¡Te tocaron <b>${c} monedas</b>!</p>`;}
    else{addItem(r);content=`<div class="giftburst"><div class="bigem">${ITEMS[r].e}</div></div><p>Te tocó: <b>${ITEMS[r].n}</b></p><p class="muted">Ya está en tus objetos.</p>`;}
    snd('lvl');updateHUD();save();
    modal('¡Caja misteriosa!',`<div class="reward">${content}</div><div class="mbtns"><button class="btn green" data-act="close">¡Genial!</button></div>`);
    addXP(5);
  },900);
}

/* ---------------- EVENTS ---------------- */
stage.addEventListener('click',e=>{
  if(justPanned){justPanned=false;return;}
  const b=e.target.closest('[data-act]');if(!b||!stage.contains(b))return;
  const act=b.dataset.act;
  if(act==='closeBg'){if(e.target===b)closeModal();return;}
  if(b.disabled)return;
  const fn=A[act];if(fn){e.preventDefault();fn(b.dataset.arg,b,e);}
});
stage.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='cname'){e.preventDefault();A.cDone();}});
stage.addEventListener('input',e=>{if(e.target.id==='cname')draft.name=e.target.value;});
stage.addEventListener('pointerdown',e=>{
  if(!S.created)return;
  const f=e.target.closest('.furn');
  if(f&&scene==='house'&&mode==='decor'&&f.dataset.uid){furnPointerDown(e,f);return;}
  if(scene==='house'&&mode==='decor'&&e.target.closest('#room')&&!f){selUid=null;document.querySelectorAll('.furn.sel').forEach(x=>x.classList.remove('sel'));const ub=$('[data-act="unplace"]');if(ub)ub.disabled=true;}
  if(e.target.closest('#bjump')){e.preventDefault();raceJump();return;}
  if(e.target.closest('#ljaccelbtn')){e.preventDefault();A.ljAccelDown();return;}
  if(e.target.closest('#ljjumpbtn')){e.preventDefault();A.ljJump();return;}
  if(scene==='kitchen'||(scene==='house'&&mode!=='bath')){roomPanStart(e);}
  const pet=e.target.closest('#pet');
  if(pet&&!mode&&(scene==='house'||scene==='garden'||scene.startsWith('visit:')||scene.startsWith('shop:')||scene==='cafe'||scene==='fish'))petTheP();
  if(mode==='bath')bathMove(e);
});
stage.addEventListener('pointermove',e=>{if(drag){furnPointerMove(e);return;}if(pan){roomPanMove(e);return;}if(mode==='bath'&&scene==='house')bathMove(e);});
window.addEventListener('pointerup',()=>{furnPointerUp();roomPanEnd();A.ljAccelUp();});
window.addEventListener('pointercancel',()=>{furnPointerUp();roomPanEnd();A.ljAccelUp();});
window.addEventListener('keydown',e=>{
  if(scene!=='race'||!R)return;
  if(R.phase==='ready'&&e.key===' '){e.preventDefault();A.raceStart();return;}
  if(['ArrowUp','w','W',' ','ArrowLeft','ArrowRight'].includes(e.key)){e.preventDefault();raceJump();}
});

/* ---------------- LOOPS ---------------- */
function petStep(dt){
  if(!$('#pet'))return;
  if(mode==='bath'||mode==='decor'){setWalking(false);return;}
  if(P.busy>0){P.busy-=dt;setWalking(false);return;}
  const dx=P.tx-P.x,dy=P.ty-P.y,d=Math.hypot(dx,dy);
  if(d<.6){
    setWalking(false);
    if(mode==='play'&&ball){kickBall();return;}
    P.wait-=dt;if(P.wait<=0){const [x0,x1,y0,y1]=P.bounds;P.tx=rnd(x0,x1);P.ty=rnd(y0,y1);P.wait=rnd(1.5,4.5);}
  }else{
    const sp=(mode==='play'?24:7)*dt;const m=Math.min(sp,d);
    P.x+=dx/d*m;P.y+=dy/d*m;if(Math.abs(dx)>.3)P.face=dx<0?-1:1;setWalking(true);
  }
  placePet();
}
let lastT=performance.now();
function frame(t){
  const dt=Math.min(.05,(t-lastT)/1000);lastT=t;
  if(S&&S.created){
    if(scene==='house'||scene==='garden'||scene==='kitchen'||scene.startsWith('visit:'))petStep(dt);
    if(scene==='race')raceStep(dt);
    if(scene==='longjump')longjumpStep(dt);
    if(scene==='skeet')skeetStep();
    if((scene.startsWith('shop:')||scene==='cafe')&&$('#keeper')&&!$('#keeper').style.left)shopPositions();
  }
  requestAnimationFrame(frame);
}
let secs=0;
function secTick(){
  if(!S||!S.created)return;secs++;
  const st=S.stats,k=1/60,extra=(st.hunger<30||st.clean<30||S.poops.length>2)?.8:0;
  st.hunger=clamp(st.hunger-1.1*k);st.clean=clamp(st.clean-.7*k);st.joy=clamp(st.joy-(.75+extra)*k);
  const now=Date.now();
  if(S.pendingPoops.some(t=>t<=now)){const due=S.pendingPoops.filter(t=>t<=now);S.pendingPoops=S.pendingPoops.filter(t=>t>now);due.forEach(spawnPoop);}
  if(scene==='garden')refreshPlots();
  updateHUD();
  const m=moodNow();if(m!==lastMood){lastMood=m;if(!mode&&$('#pet')&&scene!=='shop:cloth')setPetFace();}
  if(secs%5===0)save();
  if(secs%16===0)thought();
}
function thought(){
  if(mode||!$('#pet')||!(scene==='house'||scene==='garden'))return;
  const s=S.stats;const msgs=[];
  if(s.hunger<35)msgs.push('Tengo hambre…','¿Hay algo rico para comer?');
  if(s.clean<35)msgs.push('Necesito un baño','Me siento sucio');
  if(S.poops.length>1&&scene==='house')msgs.push('¡Qué olor! Hay que limpiar');
  if(s.joy<35)msgs.push('Me aburro…','¿Jugamos a la pelota?');
  if(!msgs.length)msgs.push('¡Qué lindo día!','Me encanta mi casa','¿Vamos a pescar?','Quiero ir al café','La la la ♪','¿Visitamos a los vecinos?');
  say(pick(msgs));
}
window.addEventListener('beforeunload',()=>{if(S&&S.created)save();});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&S&&S.created)save();});

/* ---------------- INIT ---------------- */
load();
if(S.created)offlineDecay();
render();
requestAnimationFrame(frame);
setInterval(secTick,1000);
</script>
